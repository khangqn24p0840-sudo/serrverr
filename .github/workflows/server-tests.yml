name: ScamShield server tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ScamShieldServer-Groq-useragent-fix/server/requirements.txt
      - name: Install server dependencies
        run: pip install -r requirements.txt
        working-directory: ScamShieldServer-Groq-useragent-fix/server
      - name: Run API tests
        run: python -m unittest discover -s tests -v
        working-directory: ScamShieldServer-Groq-useragent-fix/server
